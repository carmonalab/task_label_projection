# The API specifies which type of component this is.
# It contains specifications for:
#   - The input/output files
#   - Common parameters
#   - A unit test
__merge__: ../../api/comp_metric.yaml

# A unique identifier for your component (required).
# Can contain only lowercase letters or underscores.
name: sctypeeval



# Metadata for your component
info:
  metrics:
      # A unique identifier for your metric (required).
      # Can contain only lowercase letters or underscores.
    - name: sctypeeval
      # A relatively short label, used when rendering visualisarions (required)
      label: scTypeEval
      # A one sentence summary of how this metric works (required). Used when 
      # rendering summary tables.
      summary: "scTypeEval is a comprehensive tool to measure the quality of cell type annotations in single-cell RNA-seq data.
                 It provides a suite of validation metrics to benchmark annotations and improve classification performance."
      # A multi-line description of how this component works (required). Used
      # when rendering reference documentation.
      description: |
        Accurately evaluating cell type annotations in scRNA-seq is challenging due to the lack of actual ground truth.
        Traditional approaches — including manual curation and marker-based validation — are subjective, inconsistent,
        and often overlook subtle expression patterns. However, reliable cell type annotation should be consistent across
        samples and datasets, ensuring reproducibility and biological relevance.
        scTypeEval addresses these challenges by using internal validation metrics to assess label consistency without requiring predefined annotations. Tested across diverse datasets and classification scenarios, it provides a robust, unbiased framework for benchmarking annotation performance.
      # references:
      #   doi: 
      #     - 10.1000/xx.123456.789
      #   bibtex:
      #     - |
      #       @article{foo,
      #         title={Foo},
      #         author={Bar},
      #         journal={Baz},
      #         year={2024}
      #       }
      links:
        # URL to the documentation for this metric (required).
        documentation: https://github.com/carmonalab/scTypeEval
        # URL to the code repository for this metric (required).
        repository: https://github.com/carmonalab/scTypeEval
      # The minimum possible value for this metric (required)
      min: 0
      # The maximum possible value for this metric (required)
      max: 1
      # Whether a higher value represents a 'better' solution (required)
      maximize: true

# Component-specific parameters (optional)
# arguments:
#   - name: "--n_neighbors"
#     type: "integer"
#     default: 5
#     description: Number of neighbors to use.

# Resources required to run the component
resources:
  # The script of your component (required)
  - type: r_script
    path: script.R
  # Additional resources your script needs (optional)
  # - type: file
  #   path: weights.pt

engines:
  # Specifications for the Docker image for this component.
  - type: docker
    image: openproblems/base_r:1.0.0
    # Add custom dependencies here (optional). For more information, see
    # https://viash.io/reference/config/engines/docker/#setup .
    setup:
        - type: r
          github: "carmonalab/scTypeEval@dev"

runners:
  # This platform allows running the component natively
  - type: executable
  # Allows turning the component into a Nextflow module / pipeline.
  - type: nextflow
    directives:
      label: [midtime,midmem,midcpu]
